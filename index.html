<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณรายรับและรายจ่าย</title>
    <script src="budgetform.js" defer></script>
</head>

<body>
    <h1>บันทึกค่าใช้จ่าย</h1>
    <div>   
        <form id="budgetForm">
            <label for="list">รายการ:</label>
            <input type="text" id="list" name="list" placeholder="กรอกรายการ" required maxlength="50">
            <br><br>

            <label for="money">จำนวนเงิน:</label>
            <input type="number" id="money" name="money" placeholder="กรอกจำนวนเงิน" required min="1">
            <br><br>

            <label for="date">วันที่:</label>
            <input type="date" id="date" name="date" required>
            <br><br>

            <label for="time">เวลา:</label>
            <input type="time" id="time" name="time" required>
            <br><br>

            <label for="type">ประเภท:</label>
            <input type="radio" name="type" id="income" value="รายรับ" checked>
            <label for="income">รายรับ</label>
            <input type="radio" name="type" id="expense" value="รายจ่าย">
            <label for="expense">รายจ่าย</label>

            <input type="submit" value="บันทึกข้อมูล">
            <input type="reset" value="ยกเลิก">
        </form>
    </div>

    <div>
        <div><h4>รายรับรวม</h4>
            <ul id="incomeList">
                <p id="totalIncome">จำนวนทั้งหมด : 0 บาท</p>
            </ul>
        </div>

        <div><h4>รายจ่ายรวม</h4>
            <ul id="expenseList">
                <p id="totalExpense">จำนวนทั้งหมด : 0 บาท</p>
            </ul>
        </div>

        <div id="balance"><h4>ยอดคงเหลือ : 0 บาท</h4></div>
    </div>

    <div>
        <h4>รายการค่าใช้จ่ายทั้งหมด</h4>
        <ul id="transactionList">
            <!-- รายการจะเพิ่มรายการตรงนี้ -->
        </ul>   
    </div>
</body>
</html>
